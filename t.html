<uiView onLoad="
  var g = typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : Function('return this')());
  g.g = g;
  g.currentZone = 0;
  
  g.updateScreen = function(state) {
    var s0 = (state === 0) ? 'block' : 'none';
    var s1 = (state === 1) ? 'block' : 'none';
    var s2 = (state === 2) ? 'block' : 'none';
    setStyle('#screen-approach', 'display', s0);
    setStyle('#screen-climbing', 'display', s1);
    setStyle('#screen-belay', 'display', s2);
  };

  g.updateHRColors = function() {
      var colors = ['#888888', '#36E4FF', '#6EE76D', '#FFE322', '#FF9F33', '#FF2A55'];
      var color = colors[g.currentZone] || '#888888';
      var els = ['#hr-icon-1', '#hr-val-1', '#hr-icon-2', '#hr-val-2'];
      els.forEach(function(el) { setStyle(el, 'color', color); });
  };
">
  <div style="background-color:#111111; width:100%; height:100%; position:absolute; top:0; left:0;">
    
    <!-- State controller (invisible) -->
    <div style="top:0; left:0; width:0px; height:0px; position:absolute;">
        <eval input="/Zapp/{zapp_index}/Output/appState" outputFormat="script x => x" default="0" onValueChanged="g.updateScreen(Number(targetData));" />
    </div>

    <!-- APPROACH SCREEN -->
    <div id="screen-approach" style="display:block; width:100%; height:100%; position:absolute; top:0; left:0;">
       <div class="sp-t-m p-hc" style="top:12%; color:#FFDD00; font-weight:bold; position:absolute; text-align:center;">
            APPROACH
       </div>
       <div class="sp-vertical-center p-hc" style="top:36%; position:absolute;">
            <span class="f-num" style="font-size:42px; color:#FFFFFF;">
                <eval input="/Zapp/{zapp_index}/Output/approachDist" outputFormat="Count_Fourdigits" default="0" />
            </span>
            <span class="f-s" style="font-size:14px; color:#888888; margin-left:6px;">m</span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(25% - 50%e); position:absolute;">
            <span class="f-ico" style="color:#00E5FF; margin-right:6px;">&#xF112;</span>
            <span class="f-num" style="font-size:28px; color:#00E5FF;">
                <eval input="/Fusion/Altitude/Current" outputFormat="Count_Fourdigits" default="---" />
            </span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(75% - 50%e); position:absolute;">
            <span id="hr-val-1" class="f-num" style="font-size:28px; color:#FFFFFF;">
                <eval input="/Activity/Move/-1/HeartRate/Current" outputFormat="HeartRate_Fourdigits" default="--" />
            </span>
            <span id="hr-icon-1" class="f-ico" style="color:#FF2A55; margin-left:4px;">&#xF101;</span>
       </div>
    </div>

    <!-- CLIMBING SCREEN -->
    <div id="screen-climbing" style="display:none; width:100%; height:100%; position:absolute; top:0; left:0;">
       <div class="sp-t-m p-hc" style="top:12%; color:#FF5500; font-weight:bold; position:absolute; text-align:center;">
            <eval input="/Zapp/{zapp_index}/Output/inclinationDeg" outputFormat="script x => x + '°'" default="--°" />
       </div>
       <div class="sp-vertical-center p-hc" style="top:36%; position:absolute;">
            <span class="f-num" style="font-size:56px; color:#FFFFFF;">
                <eval input="/Zapp/{zapp_index}/Output/pitchAscent" outputFormat="Count_Threedigits" default="0" />
            </span>
            <span class="f-s" style="font-size:18px; color:#888888; margin-left:6px;">m</span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(25% - 50%e); position:absolute;">
            <span class="f-ico" style="color:#CCCCCC; margin-right:6px;">&#xF114;</span>
            <span class="f-num" style="font-size:28px; color:#CCCCCC;">
                <eval input="/Zapp/{zapp_index}/Output/pitchTime" outputFormat="Duration_Fourdigits" default="--:--" />
            </span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(75% - 50%e); position:absolute;">
            <span id="hr-val-2" class="f-num" style="font-size:28px; color:#FFFFFF;">
                <eval input="/Activity/Move/-1/HeartRate/Current" outputFormat="HeartRate_Fourdigits" default="--" />
            </span>
            <span id="hr-icon-2" class="f-ico" style="color:#FF2A55; margin-left:4px;">&#xF101;</span>
       </div>
    </div>

    <!-- BELAY SCREEN -->
    <div id="screen-belay" style="display:none; width:100%; height:100%; position:absolute; top:0; left:0;">
       <div class="sp-t-m p-hc" style="top:12%; color:#00E5FF; font-weight:bold; position:absolute; text-align:center;">
            BELAY
       </div>
       <div class="sp-vertical-center p-hc" style="top:36%; position:absolute;">
            <span class="f-ico" style="color:#FFFFFF; margin-right:8px;">&#xF114;</span>
            <span class="f-num" style="font-size:42px; color:#FFFFFF;">
                <eval input="/Zapp/{zapp_index}/Output/belayTime" outputFormat="Duration_Fourdigits" default="0:00" />
            </span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(25% - 50%e); position:absolute;">
            <span class="f-ico" style="color:#FF5500; margin-right:6px;">&#xF265;</span>
            <span class="f-num" style="font-size:28px; color:#FFFFFF;">
                <eval input="/Zapp/{zapp_index}/Output/pitchCount" outputFormat="Count_Threedigits" default="0" />
            </span>
       </div>
       <div class="sp-vertical-center" style="top:64%; left:calc(75% - 50%e); position:absolute;">
            <span class="f-num" style="font-size:28px; color:#FFFFFF;">
                <eval input="/Zapp/{zapp_index}/Output/moveRestRatio" outputFormat="Decimal_Onedigit" default="0.0" />
            </span>
            <span class="f-s" style="font-size:14px; color:#888888; margin-left:4px;">Ratio</span>
       </div>
    </div>

    <!-- Total Time at the bottom -->
    <div class="sp-vertical-center p-hc" style="top:calc(88% - 50%e); position:absolute;">
        <span class="f-num" style="font-size:24px; color:#666666;">
            <eval input="/Activity/Activity/-1/Duration/Current" outputFormat="Duration_Training" default="--:--" />
        </span>
    </div>

    <!-- Heart Rate Zone Subscription (invisible) -->
    <div style="top:0; left:0; width:0px; height:0px; position:absolute;">
        <eval input="/Zapp/{zapp_index}/Output/hrZoneNum" outputFormat="script x => x" default="0" onValueChanged="g.currentZone = Number(targetData) || 0; g.updateHRColors();" />
    </div>
  </div>
</uiView>
